server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html — react-router
    # resuelve la ruta del lado del cliente. Sin esto, refrescar /admin/members
    # (o cualquier ruta que no sea "/") devolvería 404 de nginx en vez de la app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
