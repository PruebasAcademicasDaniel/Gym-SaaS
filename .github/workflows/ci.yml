name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # mvn verify corre tanto los *Test (unit) como los *IT (Testcontainers) — el
      # runner de GitHub ya trae Docker instalado, así que Testcontainers funciona
      # sin configuración extra.
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    # No corre en paralelo con backend/frontend a propósito: si el código ya está
    # roto (tests o lint fallando), no tiene sentido gastar minutos de CI armando
    # las imágenes igual.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gymflow-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t gymflow-frontend:ci ./frontend
