server:
  port: 8080

spring:
  application:
    name: gymflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gymflow}
    username: ${DB_USERNAME:gymflow}
    password: ${DB_PASSWORD:gymflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

gymflow:
  security:
    jwt:
      # Solo dev: en cualquier otro entorno hay que pisar esto con JWT_SECRET (min. 32 bytes).
      secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-0123456789}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
