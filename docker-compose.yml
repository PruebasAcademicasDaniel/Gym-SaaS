services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gymflow}
      POSTGRES_USER: ${DB_USERNAME:-gymflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gymflow}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - gymflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gymflow} -d ${DB_NAME:-gymflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gymflow}
      DB_USERNAME: ${DB_USERNAME:-gymflow}
      DB_PASSWORD: ${DB_PASSWORD:-gymflow}
      # Perfil "dev": solo habilita el seed de usuario de prueba (ver db/migration-dev). No usar en producción.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  gymflow-db-data:
