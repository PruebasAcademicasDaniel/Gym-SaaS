# Compose de producción — separado de docker-compose.yml (desarrollo) a propósito:
# el frontend usa el Dockerfile.prod (build estático + nginx, no el dev server de Vite),
# el backend no corre con SPRING_PROFILES_ACTIVE=dev (sin usuario/datos de prueba
# sembrados), y ninguna variable trae un valor por defecto inseguro — todas son
# obligatorias vía el .env del servidor. Ver "Deploy" en el README para el detalle
# de cada variable y cómo generarlas.
#
# Uso: docker compose -f docker-compose.prod.yml up -d --build
#
# `name` propio (no el que Compose infiere del nombre de la carpeta): sin esto, corrida
# desde el mismo directorio que docker-compose.yml (desarrollo), ambos comparten
# contenedores/red/volumen por default y uno puede pisar al otro — se detectó de verdad
# validando esta fase, no es una precaución teórica (ver gymflow_infra_gotchas).
name: gymflow-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymflow
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gymflow-db-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d gymflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # Tag propio, distinto del que arma docker-compose.yml (desarrollo) — de otro modo
    # "docker compose -f docker-compose.prod.yml build" pisa la imagen de dev con el
    # mismo nombre por default (<proyecto>-backend:latest) y rompe el stack de dev.
    image: gymflow-backend:prod
    environment:
      DB_URL: jdbc:postgresql://db:5432/gymflow
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Opcionales: si se setean las dos, SuperAdminBootstrapper crea ese SUPER_ADMIN
      # una sola vez, la primera vez que arranca contra una base vacía (ver README).
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: gymflow-frontend:prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gymflow-db-data-prod:
